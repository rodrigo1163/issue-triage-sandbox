services:
  postgres:
    image: postgres:16-alpine
    container_name: issue-triage-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: issue_triage
      POSTGRES_USER: issue_triage
      POSTGRES_PASSWORD: issue_triage_dev
    ports:
      - "5432:5432"
    volumes:
      - issue-triage-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U issue_triage -d issue_triage"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  issue-triage-postgres-data:
